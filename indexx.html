<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail2Go Arequipa - App de Reservas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --bg-deep: #050810;
            --accent: #2563eb;
            --highlight: #2563eb;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.05) 0%, transparent 25%);
            background-attachment: fixed;
        }

        .carbon-bg {
            background-image: linear-gradient(45deg, #0a0f1d 25%, transparent 25%), 
                              linear-gradient(-45deg, #0a0f1d 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #0a0f1d 75%), 
                              linear-gradient(-45deg, transparent 75%, #0a0f1d 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px 10px, 10px 0;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #111827;
            position: relative;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wheel-marker {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            width: 35px;
            height: 40px;
            background: var(--accent);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.5));
        }

        .prize-text {
            position: absolute;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 13px;
            color: white;
            padding-top: 35px;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }

        .card-active {
            border-color: var(--accent) !important;
            background: rgba(37, 99, 235, 0.08);
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.15);
        }

        .price-strikethrough {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.85em;
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        input {
            background: #0a0f1d !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
        }
    </style>
</head>
<body class="pb-44 carbon-bg">

    <nav class="px-8 py-10 sticky top-0 z-[100] bg-slate-950/80 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-xl mx-auto flex flex-col items-center">
            <div class="flex flex-col items-center select-none">
                <div class="flex items-baseline italic uppercase">
                    <span class="text-4xl font-[900] tracking-tighter text-white">DETAIL</span>
                    <span class="text-4xl font-[900] tracking-tighter text-blue-600 ml-1">2GO</span>
                </div>
                <div class="flex items-center gap-3 mt-1">
                    <span class="text-[8px] font-black tracking-[0.6em] text-slate-400 uppercase">Arequipa Mobile Studio</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-6 pt-12 space-y-20">

        <!-- Categoría -->
        <section class="space-y-6">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] text-center italic">Categoría de Vehículo</h3>
            <div class="grid grid-cols-2 gap-5">
                <div onclick="selectVehicle('Auto')" id="btn-auto" class="glass-card cursor-pointer p-10 rounded-[2.5rem] flex flex-col items-center gap-4 card-active">
                    <i class="fa-solid fa-car text-3xl text-blue-500"></i>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] text-white">Sedán</span>
                </div>
                <div onclick="selectVehicle('SUV')" id="btn-suv" class="glass-card cursor-pointer p-10 rounded-[2.5rem] flex flex-col items-center gap-4">
                    <i class="fa-solid fa-truck-pickup text-3xl text-slate-600"></i>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">SUV / 4x4</span>
                </div>
            </div>
        </section>

        <!-- Ruleta -->
        <section class="bg-slate-900/50 rounded-[4rem] p-12 border border-white/5 flex flex-col items-center">
            <h3 class="text-[11px] font-black text-white uppercase tracking-[0.5em] mb-12 text-center italic">Desbloquea tu descuento</h3>
            <div class="wheel-marker"></div>
            <div class="wheel-container">
                <div id="wheel"></div>
            </div>
            <div id="prize-display" class="hidden mt-10 text-center">
                <div class="text-blue-400 font-black text-2xl italic bg-blue-500/10 px-10 py-5 rounded-[2rem] border-2 border-blue-500/30">
                    GANASTE: -S/ <span id="prize-value"></span>
                </div>
            </div>
            <button id="spin-btn" onclick="spinWheel()" class="mt-10 bg-white px-14 py-6 rounded-3xl font-black text-[11px] uppercase text-black tracking-[0.3em] transition-all hover:scale-105 active:scale-95">
                Girar Ruleta
            </button>
        </section>

        <!-- Protocolos -->
        <section class="space-y-8">
            <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.5em] italic text-center">Protocolos de Detallado</h3>
            <div id="services-container" class="space-y-5"></div>
        </section>

        <!-- Upgrades -->
        <section class="space-y-8">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] text-center italic">Upgrades de Protección</h3>
            <div id="extras-container" class="grid grid-cols-1 gap-5"></div>
        </section>

        <!-- Agendamiento -->
        <section class="glass-card p-12 rounded-[4rem] space-y-8 border-t-4 border-t-blue-500">
            <h3 class="text-[12px] font-black text-white uppercase tracking-[0.5em] text-center">Agendamiento</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="firstName" placeholder="Nombre" class="w-full rounded-2xl p-6 text-sm font-bold">
                    <input type="text" id="lastName" placeholder="Apellido" class="w-full rounded-2xl p-6 text-sm font-bold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="date" class="w-full rounded-2xl p-6 text-sm font-bold">
                    <input type="time" id="time" class="w-full rounded-2xl p-6 text-sm font-bold">
                </div>
            </div>
            <div class="p-5 rounded-3xl bg-blue-500/5 border border-blue-500/10 text-[11px]">
                <p class="text-slate-400"><i class="fa-solid fa-circle-info mr-2"></i> El cliente debe facilitar punto de <strong>agua y luz</strong> en el lugar del servicio.</p>
            </div>
        </section>

    </main>

    <!-- Barra Total -->
    <div class="fixed bottom-0 left-0 w-full p-8 z-[150] bg-gradient-to-t from-black via-black/80 to-transparent">
        <div class="max-w-xl mx-auto glass-card rounded-[3rem] p-7 flex items-center justify-between shadow-2xl">
            <div class="pl-4">
                <div id="old-price-container" class="hidden flex items-center gap-2 mb-1">
                    <span id="old-price" class="price-strikethrough">S/ 0</span>
                </div>
                <div id="total-display" class="text-4xl font-[900] text-white italic tracking-tighter">S/ 0</div>
            </div>
            <button onclick="sendWhatsApp()" class="btn-gradient px-12 py-6 rounded-[2.2rem] font-black text-[12px] uppercase italic text-white flex items-center gap-3 transition-all active:scale-95">
                Confirmar <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>
    </div>

    <script>
        let state = {
            vehicle: 'Auto',
            baseService: null,
            selectedExtras: [],
            prize: null,
            rotation: 0,
            isSpinning: false
        };

        const prizes = [
            { label: "S/ 3", value: 3, color: "#0f172a" },
            { label: "S/ 7", value: 7, color: "#1e293b" },
            { label: "S/ 5", value: 5, color: "#0f172a" },
            { label: "S/ 10", value: 10, color: "#2563eb" },
            { label: "S/ 4", value: 4, color: "#0f172a" },
            { label: "S/ 8", value: 8, color: "#1d4ed8" },
        ];

        // PRECIOS ACTUALIZADOS SEGUN TU PEDIDO: Sedan 75, SUV 90 para el combo full
        const services = [
            { id: 'ext', name: 'Exterior Premium', desc: 'Lavado técnico detallado + Sellado Hidrofóbico.', Auto: 30, SUV: 40, oldAuto: 50, oldSUV: 60, icon: 'fa-droplet' },
            { id: 'int', name: 'Interior Detail Pro', desc: 'Limpieza profunda de plásticos, ranuras y conductos.', Auto: 50, SUV: 60, oldAuto: 80, oldSUV: 90, icon: 'fa-soap' },
            { id: 'full', name: 'Combo Full Studio', desc: 'Protocolo completo (Interior + Exterior).', Auto: 75, SUV: 90, oldAuto: 120, oldSUV: 145, icon: 'fa-star' }
        ];

        const extras = [
            { id: 'cera', name: 'Cera Premium Hybrid', price: 20, oldPrice: 40, icon: 'fa-gem', desc: 'Brillo espejo y repelencia.' },
            { id: 'motor', name: 'Detallado Motor', price: 15, oldPrice: 35, icon: 'fa-bolt', desc: 'Limpieza técnica segura.' }
        ];

        function initWheel() {
            const wheel = document.getElementById('wheel');
            const angle = 360 / prizes.length;
            let gradient = "conic-gradient(";
            prizes.forEach((p, i) => {
                gradient += `${p.color} ${i * angle}deg ${(i + 1) * angle}deg${i === prizes.length - 1 ? "" : ", "}`;
                const textDiv = document.createElement('div');
                textDiv.className = 'prize-text';
                textDiv.style.transform = `rotate(${i * angle + (angle/2)}deg)`;
                textDiv.innerHTML = `<span>${p.label}</span>`;
                wheel.appendChild(textDiv);
            });
            wheel.style.background = gradient;
        }

        function spinWheel() {
            if (state.isSpinning || state.prize) return;
            state.isSpinning = true;
            const winningIndex = Math.floor(Math.random() * prizes.length);
            const finalRotation = state.rotation + (360 * 10) + (360 - (state.rotation % 360)) - (winningIndex * (360 / prizes.length));
            state.rotation = finalRotation;
            document.getElementById('wheel').style.transform = `rotate(${finalRotation}deg)`;
            setTimeout(() => {
                state.isSpinning = false;
                state.prize = prizes[winningIndex];
                document.getElementById('spin-btn').classList.add('hidden');
                document.getElementById('prize-display').classList.remove('hidden');
                document.getElementById('prize-value').innerText = state.prize.value;
                calculateTotal();
            }, 5000);
        }

        function selectVehicle(v) {
            state.vehicle = v;
            document.getElementById('btn-auto').classList.toggle('card-active', v === 'Auto');
            document.getElementById('btn-suv').classList.toggle('card-active', v === 'SUV');
            renderServices();
            calculateTotal();
        }

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = services.map(s => `
                <div onclick="selectService('${s.id}')" class="p-8 rounded-[3rem] border-2 cursor-pointer transition-all ${state.baseService?.id === s.id ? 'card-active' : 'glass-card border-transparent'}">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-5">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center ${state.baseService?.id === s.id ? 'bg-blue-600' : 'bg-slate-900'}">
                                <i class="fa-solid ${s.icon}"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-sm uppercase">${s.name}</h4>
                                <p class="text-[9px] text-slate-500 font-bold uppercase">${s.desc}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-xl italic">S/ ${s[state.vehicle]}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectService(id) {
            state.baseService = services.find(s => s.id === id);
            renderServices();
            calculateTotal();
        }

        function renderExtras() {
            const container = document.getElementById('extras-container');
            container.innerHTML = extras.map(e => {
                const isActive = state.selectedExtras.find(ex => ex.id === e.id);
                return `
                    <div onclick="toggleExtra('${e.id}')" class="p-6 rounded-[2.5rem] border-2 transition-all cursor-pointer ${isActive ? 'card-active' : 'glass-card border-transparent'}">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid ${e.icon} text-blue-500"></i>
                                <div>
                                    <h5 class="text-[10px] font-black uppercase text-white">${e.name}</h5>
                                    <p class="text-[9px] text-slate-500">${e.desc}</p>
                                </div>
                            </div>
                            <span class="font-black italic">S/ ${e.price}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleExtra(id) {
            const index = state.selectedExtras.findIndex(e => e.id === id);
            if (index > -1) state.selectedExtras.splice(index, 1);
            else state.selectedExtras.push(extras.find(e => e.id === id));
            renderExtras();
            calculateTotal();
        }

        function calculateTotal() {
            let total = state.baseService ? state.baseService[state.vehicle] : 0;
            let oldTotal = state.baseService ? state.baseService['old' + state.vehicle] : 0;
            total += state.selectedExtras.reduce((acc, curr) => acc + curr.price, 0);
            oldTotal += state.selectedExtras.reduce((acc, curr) => acc + curr.oldPrice, 0);
            if (state.prize) total = Math.max(0, total - state.prize.value);
            
            const oldContainer = document.getElementById('old-price-container');
            if (state.baseService) {
                oldContainer.classList.remove('hidden');
                document.getElementById('old-price').innerText = `S/ ${oldTotal}`;
            }
            document.getElementById('total-display').innerText = `S/ ${total}`;
        }

        function sendWhatsApp() {
            const fName = document.getElementById('firstName').value;
            const lName = document.getElementById('lastName').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            if (!fName || !lName || !date || !time || !state.baseService) {
                alert("Completa todos los datos del formulario.");
                return;
            }
            let message = `*⚡ RESERVA DETAIL2GO*%0A`;
            message += `*Cliente:* ${fName} ${lName}%0A`;
            message += `*Fecha:* ${date} | *Hora:* ${time}%0A`;
            message += `*Vehículo:* ${state.vehicle}%0A`;
            message += `*Servicio:* ${state.baseService.name}%0A`;
            if (state.selectedExtras.length > 0) message += `*Add-ons:* ${state.selectedExtras.map(e => e.name).join(', ')}%0A`;
            if (state.prize) message += `*Bonus:* -S/ ${state.prize.value}%0A`;
            message += `*TOTAL:* ${document.getElementById('total-display').innerText}%0A%0A`;
            message += `_Confirmo que cuento con punto de agua y luz._`;
            window.open(`https://wa.me/51937631302?text=${message}`, '_blank');
        }

        window.onload = () => {
            initWheel();
            renderServices();
            renderExtras();
        };
    </script>
</body>
</html>
